# Overlay for compose.node-b-live.yaml. Select global inference explicitly.
services:
  inference-b:
    volumes:
      - type: bind
        source: ./models/fl/current
        target: /model
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/node-b/live/predictions-global
        target: /predictions
        read_only: false
        bind: {create_host_path: false}
